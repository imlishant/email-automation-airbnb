<title>GatePass</title>

  The app lives at /frontend/index.html, and it must be served from THIS folder

-->

<link rel="canonical" href="frontend/index.html">
<style>
  body{font:15px/1.6 system-ui,sans-serif;max-width:34rem;margin:20vh auto;padding:0 1.5rem;color:#211f1d;background:#f7f6f3}
  @media (prefers-color-scheme:dark){body{background:#161513;color:#f4f1eb}a{color:#6fc7b3}}
  a{color:#14675a}
</style>
</head>
<body>
  <p>Taking you to <a href="frontend/index.html">GatePass</a>&hellip;</p>
  <p>If nothing happens, open <a href="frontend/index.html">/frontend/index.html</a>.</p>
</body>
</html>
