<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>GatePass — checks</title>
<!--
  Browser checks. These run against the REAL server, because the mock data layer
  is gone — data.js is fetch calls now.

  What they cover is precisely what the server suite cannot: that each screen
  actually mounts and renders. Two bugs reached the user through that gap (a
  missing listingRow, and the Societies tab), so it is worth its own file.

  Run:  npm start  (in backend/), then open /test.html
-->
<style>
  body{font:14px/1.6 ui-monospace,monospace;margin:0;padding:24px;background:#fff;color:#111}
  #out{white-space:pre-wrap}
  .stage{position:absolute;left:-10000px;top:0;width:1000px}
</style></head>
<body>
<div id="out">running…</div>
<!-- The real app shell. app.js captures #main at import, so this must exist
     before the module runs — module scripts are deferred, so it does. -->
<div class="stage" id="stage">
  <div class="app">
    <aside class="side">
      <button class="nav-btn" data-nav="bookings"><span class="lbl">Bookings</span></button>
      <button class="nav-btn" data-nav="settings"><span class="lbl">Settings</span></button>
      <div class="side-foot"><div class="themerow" id="themerow"></div><div class="host" id="hostchip"></div></div>
    </aside>
    <main class="main" id="main"></main>
  </div>
  <div class="toast" id="toast"></div>
  <div class="backdrop" id="backdrop"><div class="modal" id="modal"></div></div>
</div>
<script type="module">
import { CONFIG, Data, Derive, RULES, view, render, mountApp, showGuest, esc, initials, __setUnlocked } from "./js/app.js";
import { fillTemplate, daysBetween, parseDay, toDay, addDays } from "../shared/rules.js";

const R = [];
const ok = (n, c, d = "") => R.push((c ? "PASS " : "FAIL ") + n + (c ? "" : "   <<< " + d));
const $ = (s) => document.querySelector(s);
const tick = (ms = 120) => new Promise((r) => setTimeout(r, ms));

const errors = [];
addEventListener("error", (e) => errors.push(e.message));
addEventListener("unhandledrejection", (e) => errors.push("reject: " + (e.reason?.message || e.reason)));

/** Render a screen into the real #main and report what came out. */
async function screen(setup) {
  errors.length = 0;
  setup();
  await render();
  await tick();
  return { html: $("#main").innerHTML, errors: [...errors] };
}

(async () => {
try {
  // --- the server has to be there ---------------------------------------
  const health = await fetch("/healthz").then((r) => r.json()).catch(() => null);
  ok("the server is up and the database is reachable", health?.ok === true,
     "start it with: cd backend && npm start");
  if (!health?.ok) throw new Error("no server — the rest cannot run");

  // --- session ----------------------------------------------------------
  await Data.lock();
  ok("a fresh browser has no admin session", (await Data.session()).admin === false);
  ok("a wrong passcode is refused", (await Data.unlock("9999")).ok === false);
  const unlocked = await Data.unlock("0000");
  ok("the right passcode unlocks", unlocked.ok === true, JSON.stringify(unlocked));
  ok("and the session is now real", (await Data.session()).admin === true);
  ok("the passcode is never readable from the client",
     (await Data.passcode()).value === null, "the server only stores a hash");
  __setUnlocked(true);

  // --- fixtures via the real API ----------------------------------------
  for (const l of await Data.listings()) await Data.deleteListing(l.id);
  let societies = await Data.societies();
  if (!societies.length) {
    ok("a society could not be created", false, "no society and none seeded");
  }
  const socId = societies[0]?.id;
  const added = socId ? await Data.addListing({
    name: "Check Flat", icalUrl: "https://www.airbnb.co.in/calendar/ical/999.ics?s=z", societyId: socId,
  }) : { ok: false };
  ok("a listing can be created through the API", added.ok, JSON.stringify(added));

  // --- SCREENS: the gap the server suite cannot cover --------------------
  await mountApp();
  await tick(200);

  const list = await screen(() => { view.screen = "bookings"; view.listingId = null; });
  ok("the bookings screen renders without error", list.errors.length === 0, list.errors.join(" | "));
  ok("...and shows its heading and sync line",
     list.html.includes("Bookings") && list.html.includes("Auto-syncing"), list.html.slice(0, 120));

  for (const tab of ["listings", "societies", "access"]) {
    const s = await screen(() => { view.screen = "settings"; view.tab = tab; });
    ok(`the settings/${tab} tab renders`, s.errors.length === 0, s.errors.join(" | "));
    ok(`...and is not empty`, ($("#sbody")?.innerHTML.length || 0) > 50,
       `sbody length ${$("#sbody")?.innerHTML.length}`);
  }
  // The Societies tab specifically: it shipped broken once, from a stale
  // CONFIG.templateVars reference that threw during render.
  const soc = await screen(() => { view.screen = "settings"; view.tab = "societies"; });
  ok("the societies tab lists its societies", $("#sbody").querySelectorAll(".soc").length > 0,
     "no .soc cards rendered");
  ok("...and offers every template placeholder",
     RULES && $("#sbody").innerHTML.includes("{{listing}}"), "placeholder chips missing");

  const lst = await screen(() => { view.screen = "settings"; view.tab = "listings"; });
  ok("the listings tab shows the listing we created",
     lst.html.includes("Check Flat"), "the new listing is not on screen");
  ok("...and the check-in/check-out times", lst.html.includes("Check-in &amp; check-out times"));

  // --- a booking detail, if there is one --------------------------------
  const page = await Data.bookings({});
  ok("the bookings list comes back with the host's times",
     typeof page.times?.checkOutTime === "string", JSON.stringify(page.times));
  if (page.rows.length) {
    const b = page.rows[0];
    const detail = await screen(() => { view.screen = "detail"; view.bookingId = b.id; });
    ok("a booking detail renders", detail.errors.length === 0, detail.errors.join(" | "));
    ok("...and the guest link is a real token URL",
       detail.html.includes("Copy guest upload link"), "no share controls");
  } else {
    ok("booking detail (skipped: no bookings synced yet)", true);
  }

  // --- the guest surface -------------------------------------------------
  const bad = await Data.guestBooking("forged.token");
  ok("a forged guest token gets nothing", bad === null, JSON.stringify(bad));
  errors.length = 0;
  await showGuest("forged.token");
  await tick();
  ok("...and the guest page says so rather than breaking",
     document.body.innerHTML.includes("Link not active") && errors.length === 0, errors.join(" | "));
  document.getElementById("guestScreen")?.remove();

  // --- the shared rules are the same module both sides use ---------------
  ok("retention is one instant, from shared/rules.js",
     RULES.hideBookingAfterCheckoutHours === RULES.purgeRecordAfterCheckoutHours);
  ok("calendar maths is the server's own", daysBetween("2026-09-20", "2026-09-23") === 3);
  ok("dates stay on their local day", parseDay("2026-09-20").getDate() === 20);
  ok("placeholder names are recognised",
     Derive.isPlaceholderName("Adult 3") && !Derive.isPlaceholderName("Priya Menon"));
  ok("templates fill with no placeholder left",
     !/\{\{\w+\}\}/.test(fillTemplate("{{listing}} {{booking_id}} {{adult_count}}",
       { listingName: "X", code: "HM1", people: [{}] }, (d) => d)));
  ok("helpers survive odd input",
     initials("") === "?" && initials("Priya") === "P" && esc(null) === "" && esc("<b>") === "&lt;b&gt;");

  // --- tidy up -----------------------------------------------------------
  if (added.ok) await Data.deleteListing(added.listing.id);
} catch (e) {
  ok("the checks ran to completion", false, e.stack || e.message);
}

const pass = R.filter((r) => r.startsWith("PASS")).length;
$("#out").innerHTML = R.map((r) => r.startsWith("PASS")
  ? `<span style="color:#1a7f4b">${r}</span>`
  : `<b style="color:#b3261e">${r}</b>`).join("\n")
  + `\n\n${pass}/${R.length} passed` + (pass === R.length ? "" : "   — SOMETHING IS BROKEN");
document.title = `${pass}/${R.length} passed`;
})();
</script>
</body></html>
